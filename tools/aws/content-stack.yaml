AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and CloudFront OAC for Kotohogu CMS content

Parameters:
  GitHubRepository:
    Type: String
    Default: kaeruko/kotohogu
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
    Description: GitHub owner/repository allowed to publish from the main branch

Resources:
  ContentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled

  ContentOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Signed access to private Kotohogu content
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ContentDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Kotohogu CMS immutable content releases
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: KotohoguContentS3
            DomainName: !GetAtt ContentBucket.RegionalDomainName
            OriginAccessControlId: !Ref ContentOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: KotohoguContentS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOnlyRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ContentBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ContentDistribution}'

  GitHubContentDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Publish Kotohogu immutable content from GitHub Actions
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
      Policies:
        - PolicyName: PublishContent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadContentStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Sid: ReadBucketMetadata
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt ContentBucket.Arn
              - Sid: ListReleaseObjects
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ContentBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - releases/*
              - Sid: PublishAndVerifyRelease
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${ContentBucket.Arn}/releases/*'
                  - !Sub '${ContentBucket.Arn}/current.json'

Outputs:
  ContentBucketName:
    Value: !Ref ContentBucket
  ContentDistributionId:
    Value: !Ref ContentDistribution
  ContentDomain:
    Value: !GetAtt ContentDistribution.DomainName
  GitHubContentDeployRoleArn:
    Description: Set this as the GitHub Actions variable AWS_CONTENT_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubContentDeployRole.Arn
