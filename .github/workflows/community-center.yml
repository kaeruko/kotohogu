name: Community center checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  community-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f pubspec.yaml
      - run: flutter analyze
      - run: flutter test test/community_center_test.dart
