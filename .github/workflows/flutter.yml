name: Flutter quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: python -m unittest discover -s tools/dialogue_cms -p 'test_*.py'
      - run: python -m unittest discover -s tools/android -p 'test_*.py'
      - run: python -m unittest discover -s tools/aws -p 'test_*.py'
      - run: flutter pub get
      # Android/Web icons use pubspec.yaml explicitly: the iOS flavor file
      # otherwise gets selected automatically on this Linux runner.
      - run: dart run flutter_launcher_icons -f pubspec.yaml
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
