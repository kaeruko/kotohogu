name: iOS TestFlight (Build and Upload)

# Signed builds must never run for forked pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotohogu-ios-testflight
  cancel-in-progress: false

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check release branch and prevent build-number reuse
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::TestFlight releases must run from main"
            exit 1
          }
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || {
            echo "::error::Re-running uses the same iOS build number. Start a new workflow run instead."
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Prepare Flutter and iOS Runner
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create --platforms=ios --project-name future_lift --org jp.cloxs .
          fi
          # iOS is generated on the runner, so generate icons afterwards.
          dart run flutter_launcher_icons -f ios_app_icon_config.yaml
          xcodebuild -version

      - name: Install Apple distribution signing materials
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ] || [ -z "$IOS_PROFILE_BASE64" ]; then
            echo "::error::Set IOS_P12_BASE64, IOS_P12_PASSWORD and IOS_PROFILE_BASE64 in GitHub Actions secrets."
            exit 1
          fi

          cert_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/distribution.mobileprovision"
          plist_path="$RUNNER_TEMP/distribution-profile.plist"
          keychain_path="$RUNNER_TEMP/kotohogu-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$IOS_P12_BASE64" | base64 -D > "$cert_path"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" -o "$plist_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist_path")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cp "$profile_path" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_PLIST=$plist_path" >> "$GITHUB_ENV"

      - name: Configure Bundle ID, signing and export
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ios/prepare_xcode_project.py \
            --profile-plist "$IOS_PROFILE_PLIST" \
            --export-options "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint ios/Runner.xcodeproj/project.pbxproj
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build signed App Store IPA
        shell: bash
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-number "$GITHUB_RUN_NUMBER" \
            --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
          test -n "$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Keep signed IPA for download
        uses: actions/upload-artifact@v4
        with:
          name: kotohogu-app-store-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7


      - name: Verify IPA identity and Apple signature
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          [[ "${#ipas[@]}" -eq 1 ]] || {
            echo "::error::Expected exactly one built IPA"
            exit 1
          }
          ipa="${ipas[0]}"
          mkdir -p "$RUNNER_TEMP/verify-ipa"
          unzip -q "$ipa" -d "$RUNNER_TEMP/verify-ipa"
          apps=("$RUNNER_TEMP"/verify-ipa/Payload/*.app)
          [[ "${#apps[@]}" -eq 1 && -d "${apps[0]}" ]] || {
            echo "::error::Expected exactly one app in IPA"
            exit 1
          }
          app="${apps[0]}"
          info="$app/Info.plist"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")
          display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info")
          build_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")
          [[ "$bundle_id" == "jp.cloxs.kotohogu" ]] || {
            echo "::error::Unexpected IPA bundle ID: $bundle_id"
            exit 1
          }
          [[ "$display_name" == "ことほぐ" ]] || {
            echo "::error::Unexpected IPA display name: $display_name"
            exit 1
          }
          [[ "$build_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid IPA release version: $build_name"
            exit 1
          }
          [[ "$build_number" == "$GITHUB_RUN_NUMBER" ]] || {
            echo "::error::IPA build number $build_number differs from workflow build number $GITHUB_RUN_NUMBER"
            exit 1
          }
          codesign --verify --deep --strict "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          grep -Fq 'Authority=Apple Distribution: CLOXS LLC' <<< "$signature" || {
            echo "::error::Unexpected IPA distribution certificate"
            exit 1
          }
          grep -Fq 'TeamIdentifier=H5B52RL9R2' <<< "$signature" || {
            echo "::error::IPA was not signed by the expected Apple team"
            exit 1
          }
          echo "VERIFIED_IPA=$ipa" >> "$GITHUB_ENV"
          {
            echo "- Verified bundle: $bundle_id"
            echo "- Verified version: $build_name ($build_number)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "::error::Missing or invalid APP_STORE_CONNECT_API_KEY_ID"
            exit 1
          }
          [[ -n "$ASC_ISSUER_ID" && -n "$ASC_KEY_BASE64" ]] || {
            echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID or APP_STORE_CONNECT_API_KEY_P8_BASE64"
            exit 1
          }
          umask 077
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 -D > "$key_path"
          test -s "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path" || {
            echo "::error::Invalid App Store Connect .p8 secret"
            exit 1
          }
          chmod 600 "$key_path"

      - name: Validate and upload to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --file "$VERIFIED_IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app \
            --file "$VERIFIED_IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "- Uploaded to App Store Connect; Apple processing may still be pending." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing materials and API key
        if: always()
        shell: bash
        run: |
          if [ -e "$RUNNER_TEMP/kotohogu-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/kotohogu-signing.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" \
                "$RUNNER_TEMP/distribution.mobileprovision" \
                "$RUNNER_TEMP/distribution-profile.plist" \
                "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/verify-ipa"
